name: ci

on:
  push:
    # The gate below performs the full numeric and calendar validation. This
    # filter keeps ordinary branch pushes and pull requests from starting CI.
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[1-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release tag and source identity
        id: release
        run: |
          python3 - <<'PY_RELEASE_GATE'
          import datetime
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          version = Path("VERSION").read_text().strip()
          tag = os.environ["GITHUB_REF_NAME"]
          ref = os.environ["GITHUB_REF"]
          if ref != f"refs/tags/{tag}":
              raise SystemExit("Release builds require a tag ref")
          if not re.fullmatch(r"[0-9]{8}\.[1-9][0-9]*", version):
              raise SystemExit("VERSION must use YYYYMMDD.N with a positive sequence")
          try:
              datetime.datetime.strptime(version.split(".", 1)[0], "%Y%m%d")
          except ValueError:
              raise SystemExit("VERSION must contain a valid calendar date") from None
          if tag != version:
              raise SystemExit(f"Tag {tag!r} must exactly match VERSION {version!r}")

          expected_manifest_version = f"{version}.0"
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          if cargo.get("workspace", {}).get("package", {}).get("version") != expected_manifest_version:
              raise SystemExit("Cargo workspace version must equal VERSION + .0")
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          workspace_packages = {
              package.get("name"): package.get("version")
              for package in lock.get("package", [])
              if package.get("name") in {"garage-ui", "garage-loadgen"}
          }
          if workspace_packages != {
              "garage-ui": expected_manifest_version,
              "garage-loadgen": expected_manifest_version,
          }:
              raise SystemExit("Cargo.lock workspace package versions must equal VERSION + .0")
          web = json.loads(Path("web/package.json").read_text())
          if web.get("version") != expected_manifest_version:
              raise SystemExit("web/package.json version must equal VERSION + .0")

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          workflow_commit = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", commit) or commit != workflow_commit:
              raise SystemExit("Checkout must match the full workflow commit")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\ncommit={commit}\n")
          PY_RELEASE_GATE

  verify:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm validated source identity
        env:
          BUILD_VERSION: ${{ needs.gate.outputs.version }}
          GIT_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$GIT_COMMIT"
          test "$(cat VERSION)" = "$BUILD_VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          download="$RUNNER_TEMP/gitleaks-download"
          mkdir -p "$download"
          cd "$download"
          curl --fail --location --show-error --silent --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --location --show-error --silent --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          grep "  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar --extract --gzip --file "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan source and history for secrets
        run: scripts/secret-scan.sh
      - name: Verify release script contracts
        run: scripts/check-release-version.sh
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: web
        run: bun run lint
      - name: Type-check frontend
        working-directory: web
        run: bun run typecheck
      - name: Test frontend
        working-directory: web
        run: bun run test
      - name: Build embedded frontend for Rust tests
        working-directory: web
        run: bun run build
      - name: Prepare Garage integration fixture image
        run: docker pull dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
      - name: Tag Garage integration fixture image
        run: docker tag dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020 dxflrs/garage:v2.4.1
      - name: Test Rust workspace
        run: cargo test --workspace --locked

  build-images:
    needs: [gate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ needs.gate.outputs.version }}
      GIT_COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm validated source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GIT_COMMIT"
          test "$(cat VERSION)" = "$BUILD_VERSION"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.0
      - name: Build native image
        run: scripts/build.sh --images ${{ matrix.architecture }}
      - name: Save native image
        run: docker image save --output "$RUNNER_TEMP/garage-ui-${{ matrix.architecture }}.tar" "garage-ui:$BUILD_VERSION-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garage-ui-image-${{ matrix.architecture }}
          path: ${{ runner.temp }}/garage-ui-${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [gate, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      BUILD_VERSION: ${{ needs.gate.outputs.version }}
      GIT_COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm validated source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GIT_COMMIT"
          test "$(cat VERSION)" = "$BUILD_VERSION"
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2-52
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: garage-ui-image-amd64
          path: ${{ runner.temp }}/prebuilt-images/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: garage-ui-image-arm64
          path: ${{ runner.temp }}/prebuilt-images/arm64
      - name: Load native images
        run: |
          docker image load --input "$RUNNER_TEMP/prebuilt-images/amd64/garage-ui-amd64.tar"
          docker image load --input "$RUNNER_TEMP/prebuilt-images/arm64/garage-ui-arm64.tar"
      - name: Build and verify unsigned release artifacts
        run: scripts/release.sh "$RUNNER_TEMP/release-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_GITHUB_RELEASE: "true"
        run: scripts/publish.sh "$RUNNER_TEMP/release-artifacts"
      # publish.sh already checked the draft before publishing. Check the published release
      # again from an empty directory: the asset names must be exactly the SHA256SUMS names
      # and `sha256sum --check --strict` must pass.
      - name: Verify the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/verify-release-assets.sh "$RUNNER_TEMP/published-assets" "$BUILD_VERSION"
